draw_square:
  ros__parameters:
    group_name: arm
    joint_names:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    wrap_joint_names:
      - joint6
    max_wrap_joint_delta: 3.0

    gripper_action_name: /gripper_controller/follow_joint_trajectory
    hardware_gripper_action_name: /rebotarm/gripper/command
    gripper_joint_names: [gripper_joint1, gripper_joint2]
    closed_gripper_position: 0.0
    hardware_closed_gripper_position: 0.0
    gripper_motion_duration: 1.0
    gripper_max_effort: 10.0

    frame_id: base_link
    tcp_link_name: gripper_tcp
    start_point: [0.15, 1.55, 1.35, -1.30, 0.0, 0.15]

    rectangle_center: [0.28, 0.0, 0.12]
    rectangle_width: 0.04
    rectangle_height: 0.08
    tcp_rpy: [0.0, 1.57, 0.0]
    tcp_yaw_offsets: [0.0, 3.1416, -3.1416]

    planning_time: 5.0
    planner_id: RRTConnect
    pipeline_id: ompl
    joint_tolerance: 0.01
    velocity_scaling: 0.2
    acceleration_scaling: 0.2
    ik_timeout: 5.0
    result_timeout: 30.0
    avoid_collisions: true
